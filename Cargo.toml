[package]
name = "cpm-planner"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/praxec/cpm-planner"
homepage = "https://github.com/praxec/cpm-planner"
documentation = "https://docs.rs/cpm-planner"
description = "Critical Path Method planner as an MCP server: schedules task graphs (slack, critical path, resource levelling, Monte Carlo), leases lock-aware parallel cohorts to agents, versions plan-as-code variants, and tracks earned value."
authors = ["Matthew Cochran <matthew@cochranweb.com>"]
readme = "README.md"
keywords = ["mcp", "critical-path", "scheduling", "earned-value", "agents"]
categories = ["development-tools", "command-line-utilities"]
# Repository tooling, CI, design history and container files stay out of the
# crate. tests/repo_hygiene.rs checks the git checkout (line endings, issue
# forms, doc links), so it is not packaged either.
exclude = [
    "/.agents/",
    "/.claude/",
    "/.cpm-planner/",
    "/.delivery/",
    "/.superpowers/",
    "/.github/",
    "/docs/superpowers/",
    "/scripts/",
    "/tests/repo_hygiene.rs",
    "/Dockerfile",
    "/.dockerignore",
    "/.editorconfig",
    "/.gitattributes",
    "/.gitignore",
    "/.ignore",
    "/delivery.config.json",
    "/deny.toml",
    "/rust-toolchain.toml",
    "/server.json",
]

[package.metadata.docs.rs]
# No cargo features and no `docsrs` cfg: build the docs for one target only.
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "cpm_planner"
path = "src/lib.rs"

[[bin]]
name = "cpm-planner"
path = "src/bin/server.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
# Shared reliability vocabulary (retry / circuit-break). The durable, cross-process
# deliverable-lease circuit breaker classifies + decides through this crate's
# FailureClass / RetryDecision types so cpm-planner speaks the same reliability
# language as the rest of praxec (rather than hand-rolling its own).
execution-policy = "0.0.6"
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
rand_distr = { version = "0.6.0", default-features = false, features = ["std"] }
rmcp = { version = "1.8", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
rig-core = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
rig-typesafeai = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
# Each JevJudge owns its reqwest client (see src/llm/jev.rs); same features as rig's.
rig-reqwest = { version = "0.44", default-features = false, features = ["rustls"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
# errno constants for classifying unsupported hard links (write_new_graph).
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
# Parses the issue-form YAML in tests/repo_hygiene.rs (maintained serde_yaml fork).
serde_yaml_ng = "0.10.0"
# Parses the generated Gemini command files in tests/skills_install.rs.
toml = "0.9"
