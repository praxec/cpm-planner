# cargo-deny configuration (cargo-deny 0.20). Run: cargo deny check

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Exactly the SPDX licenses present in the dependency tree
# (`cargo deny list -f tsv -l crate`). Copyleft (GPL/AGPL/LGPL) is never allowed;
# r-efi is "MIT OR Apache-2.0 OR LGPL-2.1-or-later" and is satisfied via MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# Add a [[licenses.clarify]] entry here only if a crate's license fails detection.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
